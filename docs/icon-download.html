<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"/><title>App Icon</title>
<style>body{margin:0;background:#222;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:20px;font-family:sans-serif;color:white;}</style>
</head>
<body>
<img src="icon.svg" width="300" height="300" style="border-radius:60px;" id="icon"/>
<a id="dl" download="seo-ai-icon-1200.jpg" style="background:#00d4aa;color:#1a1a2e;padding:12px 28px;border-radius:8px;font-weight:700;font-size:15px;text-decoration:none;cursor:pointer;">⬇ Descargar ícono JPG 1200x1200 (para Shopify)</a>
<p id="size" style="font-size:13px;opacity:0.6;">Calculando tamaño...</p>
<script>
window.onload = function() {
  const img = new Image();
  img.onload = function() {
    const canvas = document.createElement('canvas');
    canvas.width = 1200; canvas.height = 1200;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, 1200, 1200);
    ctx.drawImage(img, 0, 0, 1200, 1200);
    const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
    document.getElementById('dl').href = dataUrl;
    const bytes = Math.round((dataUrl.length * 3) / 4 / 1024);
    document.getElementById('size').textContent = 'Tamaño aprox: ' + bytes + ' KB';
  };
  img.src = 'icon.svg';
};
</script>
</body>
</html>
